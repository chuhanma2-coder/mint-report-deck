interface:
  display_name: "Mint 中文汇报"
  short_description: "粗略笔记生成最少页数的 Mint PPTX 与互动 HTML"
  brand_color: "#1C7866"
  default_prompt: "请把我的粗略笔记整理成 Mint 汇报材料。先识别汇报对象、要推动的决定和页数硬约束，再把每段内容解析为背景、证据、机制、影响、风险或行动，并按决策线程组织；不要根据标题、编号或段落数量机械拆页。用户要求必须一页时只能交付一页，先重组内容，仍放不下则阻断，不得擅自生成第二页。逐项冻结事实、实体、数字、公式和阈值，选择正确的关系图或图表；任何主要信息未清晰展示时不得交付正式版。只使用我提供的事实，同时生成可编辑 PPTX 和互动 HTML。"
policy:
  allow_implicit_invocation: true
